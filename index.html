<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>繳費紀錄</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #6c63ff 0%, #5a52d5 100%);
      color: white;
      padding: 18px 20px 20px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    header h1 { font-size: 20px; font-weight: 700; }
    header .date { font-size: 13px; opacity: 0.85; margin-top: 2px; }

    .fee-display {
      margin-top: 14px;
      background: rgba(255,255,255,0.18);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .fee-display .fee-label {
      font-size: 14px;
      opacity: 0.95;
      font-weight: 600;
      flex-shrink: 0;
    }

    .fee-display .fee-input-wrap {
      flex: 1;
      display: flex;
      align-items: baseline;
      justify-content: flex-end;
      gap: 4px;
    }

    .fee-display .currency {
      font-size: 22px;
      font-weight: 700;
      color: white;
    }

    .fee-display input {
      background: transparent;
      border: none;
      color: white;
      font-size: 32px;
      font-weight: 800;
      text-align: right;
      width: 130px;
      outline: none;
      padding: 2px 0;
      border-bottom: 2px dashed rgba(255,255,255,0.5);
      transition: border-color 0.2s;
      -moz-appearance: textfield;
    }

    .fee-display input::-webkit-outer-spin-button,
    .fee-display input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .fee-display input:focus {
      border-bottom-color: white;
    }

    .edit-hint {
      color: white;
      opacity: 0.7;
      font-size: 11px;
      margin-top: 6px;
      text-align: right;
      padding-right: 4px;
    }

    .summary {
      display: flex;
      gap: 10px;
      padding: 12px 16px;
      background: white;
      border-bottom: 1px solid #e2e8f0;
    }

    .stat {
      flex: 1;
      text-align: center;
      padding: 10px 8px;
      background: #f8f7ff;
      border-radius: 12px;
    }

    .stat .num {
      font-size: 22px;
      font-weight: 700;
      color: #6c63ff;
    }

    .stat .label {
      font-size: 11px;
      color: #718096;
      margin-top: 2px;
    }

    .stat.total .num { color: #38a169; }

    .list { padding: 12px 16px; }

    .person {
      display: flex;
      align-items: center;
      background: white;
      border-radius: 14px;
      margin-bottom: 10px;
      padding: 14px 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      transition: opacity 0.2s;
    }

    .person.paid { background: #f0fff4; }

    .person-name {
      flex: 1;
      font-size: 17px;
      font-weight: 500;
      color: #2d3748;
    }

    .person.paid .person-name {
      color: #38a169;
    }

    .paid-badge {
      font-size: 12px;
      color: #38a169;
      margin-right: 10px;
      font-weight: 600;
    }

    .pay-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s;
      flex-shrink: 0;
    }

    .pay-btn:active { transform: scale(0.9); }

    .person:not(.paid) .pay-btn {
      background: #6c63ff;
      color: white;
    }

    .person.paid .pay-btn {
      background: #c6f6d5;
      color: #38a169;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #cbd5e0;
      font-size: 20px;
      cursor: pointer;
      padding: 4px 8px;
      margin-right: 4px;
    }

    .delete-btn:active { color: #e53e3e; }

    .add-area {
      padding: 0 16px 16px;
    }

    .add-row {
      display: flex;
      gap: 8px;
    }

    .add-row input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    .add-row input:focus { border-color: #6c63ff; }

    .add-row button {
      padding: 12px 18px;
      background: #6c63ff;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .actions {
      padding: 0 16px 24px;
      display: flex;
      gap: 10px;
    }

    .reset-btn {
      flex: 1;
      padding: 13px;
      background: white;
      color: #e53e3e;
      border: 2px solid #fed7d7;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .export-btn {
      flex: 1;
      padding: 13px;
      background: white;
      color: #6c63ff;
      border: 2px solid #e9d8fd;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .empty {
      text-align: center;
      color: #a0aec0;
      padding: 32px 0;
      font-size: 15px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #2d3748;
      color: white;
      padding: 10px 20px;
      border-radius: 24px;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      white-space: nowrap;
    }

    .toast.show { opacity: 1; }

    .week-label {
      text-align: center;
      font-size: 12px;
      color: #a0aec0;
      padding: 6px 0 4px;
    }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>💰 繳費紀錄</h1>
  </div>
  <div class="date" id="dateLabel"></div>

  <div class="fee-display">
    <div class="fee-label">此次繳納金額</div>
    <div class="fee-input-wrap">
      <span class="currency">$</span>
      <input type="number" id="feeInput" min="0" step="1" inputmode="numeric">
    </div>
  </div>
  <div class="edit-hint">👆 點數字可修改</div>
</header>

<div class="summary">
  <div class="stat">
    <div class="num" id="paidCount">0</div>
    <div class="label">已繳人數</div>
  </div>
  <div class="stat">
    <div class="num" id="unpaidCount">0</div>
    <div class="label">未繳人數</div>
  </div>
  <div class="stat total">
    <div class="num" id="totalAmount">$0</div>
    <div class="label">已收金額</div>
  </div>
</div>

<div class="week-label" id="weekLabel"></div>

<div class="list" id="list"></div>

<div class="add-area">
  <div class="add-row">
    <input type="text" id="nameInput" placeholder="輸入姓名" maxlength="20">
    <button onclick="addPerson()">新增</button>
  </div>
</div>

<div class="actions">
  <button class="reset-btn" onclick="resetWeek()">🔄 新的一週（清除繳費）</button>
  <button class="export-btn" onclick="exportResult()">📋 複製結果</button>
</div>

<div class="toast" id="toast"></div>

<script>
  let data;
  try {
    data = JSON.parse(localStorage.getItem('paymentData') || '{"people":[],"weekStart":"","fee":235}');
  } catch (e) {
    data = { people: [], weekStart: '', fee: 235 };
  }
  if (typeof data.fee !== 'number') data.fee = 235;

  function getWeekStart() {
    const d = new Date();
    const day = d.getDay();
    const diff = d.getDate() - day + (day === 0 ? -6 : 1);
    const mon = new Date(d.setDate(diff));
    return mon.toISOString().slice(0, 10);
  }

  function save() {
    try {
      localStorage.setItem('paymentData', JSON.stringify(data));
    } catch (e) {
      showToast('⚠️ 儲存失敗，請確認瀏覽器設定');
    }
  }

  function render() {
    const list = document.getElementById('list');
    const paid = data.people.filter(p => p.paid);
    const unpaid = data.people.filter(p => !p.paid);

    document.getElementById('paidCount').textContent = paid.length;
    document.getElementById('unpaidCount').textContent = unpaid.length;
    document.getElementById('totalAmount').textContent = '$' + (paid.length * data.fee).toLocaleString();

    if (data.people.length === 0) {
      list.innerHTML = '<div class="empty">還沒有人喔，先新增名單吧！</div>';
      return;
    }

    list.innerHTML = data.people.map((p, i) => `
      <div class="person ${p.paid ? 'paid' : ''}" id="person-${i}">
        <button class="delete-btn" onclick="deletePerson(${i})">✕</button>
        <span class="person-name">${escapeHtml(p.name)}</span>
        ${p.paid ? `<span class="paid-badge">$${data.fee} ✓</span>` : ''}
        <button class="pay-btn" onclick="togglePaid(${i})">
          ${p.paid ? '✓' : '$'}
        </button>
      </div>
    `).join('');
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function updateLabels() {
    const now = new Date();
    const dateStr = now.toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
    document.getElementById('dateLabel').textContent = dateStr;

    const ws = data.weekStart || getWeekStart();
    document.getElementById('weekLabel').textContent = `本週：${ws} 起`;
  }

  function addPerson() {
    const input = document.getElementById('nameInput');
    const name = input.value.trim();
    if (!name) {
      showToast('請輸入姓名');
      return;
    }
    if (data.people.find(p => p.name === name)) {
      showToast('這個名字已經在了！');
      return;
    }
    data.people.push({ name, paid: false });
    if (!data.weekStart) data.weekStart = getWeekStart();
    input.value = '';
    save();
    render();
    showToast(`✅ 已新增「${name}」`);
  }

  function togglePaid(i) {
    data.people[i].paid = !data.people[i].paid;
    save();
    render();
    const p = data.people[i];
    showToast(p.paid ? `✅ ${p.name} 已繳 $${data.fee}` : `↩️ ${p.name} 取消繳費`);
  }

  function deletePerson(i) {
    const name = data.people[i].name;
    if (!confirm(`確定要刪除「${name}」嗎？`)) return;
    data.people.splice(i, 1);
    save();
    render();
  }

  function resetWeek() {
    if (!confirm('新的一週開始！清除所有人的繳費記錄（名單保留）？')) return;
    data.people.forEach(p => p.paid = false);
    data.weekStart = getWeekStart();
    save();
    render();
    updateLabels();
    showToast('✨ 已重置，開始新的一週！');
  }

  function exportResult() {
    const paid = data.people.filter(p => p.paid).map(p => p.name);
    const unpaid = data.people.filter(p => !p.paid).map(p => p.name);
    const now = new Date().toLocaleDateString('zh-TW');
    let text = `📅 ${now} 繳費紀錄（每人 $${data.fee}）\n`;
    text += `━━━━━━━━━━━━━\n`;
    text += `✅ 已繳（${paid.length} 人）：\n`;
    text += paid.length ? paid.join('、') + '\n' : '（無）\n';
    text += `\n❌ 未繳（${unpaid.length} 人）：\n`;
    text += unpaid.length ? unpaid.join('、') + '\n' : '（無）\n';
    text += `\n💰 已收：$${(paid.length * data.fee).toLocaleString()}`;

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => {
        showToast('📋 已複製到剪貼簿！');
      }).catch(() => {
        prompt('複製以下內容：', text);
      });
    } else {
      prompt('複製以下內容：', text);
    }
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  const feeInput = document.getElementById('feeInput');
  feeInput.value = data.fee;
  feeInput.addEventListener('input', () => {
    const v = parseInt(feeInput.value, 10);
    if (!isNaN(v) && v >= 0) {
      data.fee = v;
      save();
      render();
    }
  });
  feeInput.addEventListener('blur', () => {
    if (!feeInput.value || parseInt(feeInput.value, 10) < 0) {
      feeInput.value = data.fee;
    }
  });

  document.getElementById('nameInput').addEventListener('keypress', e => {
    if (e.key === 'Enter') addPerson();
  });

  updateLabels();
  render();
</script>

</body>
</html>
